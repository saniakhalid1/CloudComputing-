<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 900px">
  <h1 class="h3 mb-4">Loan EMI Calculator</h1>

  <div class="row g-4">
    <div class="col-md-6">
      <form id="emi-form" class="card card-body" novalidate>
        <label class="form-label" for="principal">Loan amount (P)</label>
        <input class="form-control mb-3" id="principal" type="number" min="1" step="any" value="500000">
        <label class="form-label" for="rate">Annual interest rate (%)</label>
        <input class="form-control mb-3" id="rate" type="number" min="0.01" max="100" step="any" value="12">
        <label class="form-label" for="months">Tenure (months)</label>
        <input class="form-control mb-3" id="months" type="number" min="1" max="1200" step="1" value="24">
        <div id="error" class="text-danger small mb-2"></div>
        <button class="btn btn-primary" type="submit">Calculate</button>
      </form>
    </div>

    <div class="col-md-6">
      <div class="card card-body h-100" id="result">
        <h2 class="h5">Result</h2>
        <p class="text-muted mb-0">Enter the loan details and press Calculate.</p>
      </div>
    </div>
  </div>

  <h2 class="h5 mt-4">Last 10 calculations</h2>
  <div class="table-responsive">
    <table class="table table-sm table-striped bg-white">
      <thead><tr><th>Time</th><th>Amount</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Served by</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </div>

  <footer class="text-muted small mt-4">Loan EMI Calculator · version {{ version }}</footer>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  const money = x => Number(x).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const esc = s => $("<div>").text(String(s)).html();

  function loadHistory() {
    $.getJSON("/api/history", rows => {
      $("#history").html(rows.map(r => `<tr>
        <td>${esc(new Date(r.createdAt).toLocaleString())}</td><td>${money(r.principal)}</td>
        <td>${esc(r.rate)}</td><td>${esc(r.months)}</td><td>${money(r.emi)}</td><td>${esc(r.servedBy)}</td></tr>`).join(""));
    });
  }

  $("#emi-form").on("submit", function (e) {
    e.preventDefault();                       // no postback: the page is never reloaded
    const data = {principal: +$("#principal").val(), rate: +$("#rate").val(), months: +$("#months").val()};

    // client-side validation: positive numbers only, months a whole number
    if (!(data.principal > 0 && data.rate > 0 && data.rate <= 100 &&
          data.months > 0 && data.months <= 1200 && Number.isInteger(data.months))) {
      $("#error").text("Please enter positive numbers (rate up to 100%, months a whole number up to 1200).");
      return;
    }
    $("#error").text("");

    $.ajax({url: "/api/emi", method: "POST", contentType: "application/json", data: JSON.stringify(data)})
      .done(r => {
        $("#result").html(`<h2 class="h5">Result</h2>
          <p class="mb-1">Monthly EMI: <strong>${money(r.emi)}</strong></p>
          <p class="mb-1">Total payment: ${money(r.totalPayment)}</p>
          <p class="mb-3">Total interest: ${money(r.totalInterest)}</p>
          <p class="text-muted small mb-0">Served by pod <code>${esc(r.servedBy)}</code> (${esc(r.podIP)})</p>`);
        loadHistory();
      })
      .fail(x => $("#error").text(x.responseJSON ? x.responseJSON.error : "Server error"));
  });

  loadHistory();
</script>
</body>
</html>
