# Runs once: waits for the 3 MongoDB pods, creates replica set rs0 (rs.initiate), waits until there is
# one PRIMARY and two SECONDARY members, prints rs.status() and creates the index used by /api/history.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mongo-init
        image: mongo:7.0
        command: ["bash", "-c"]
        args:
        - |
          set -e
          for h in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
            until mongosh --quiet --host $h --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; do
              echo "waiting for $h ..."; sleep 3
            done
            echo "$h is up"
          done
          mongosh --quiet --host mongo-0.mongo --eval '
            try { rs.status(); print("replica set rs0 is already initiated") }
            catch (e) {
              print("rs.initiate():");
              printjson(rs.initiate({_id: "rs0", members: [
                {_id: 0, host: "mongo-0.mongo:27017"},
                {_id: 1, host: "mongo-1.mongo:27017"},
                {_id: 2, host: "mongo-2.mongo:27017"}]}));
            }
            // right after rs.initiate() all members are SECONDARY until the first election is won
            const count = s => rs.status().members.filter(m => m.stateStr == s).length;
            while (!(count("PRIMARY") == 1 && count("SECONDARY") == 2)) { sleep(1000) }
            print("rs.status():");
            rs.status().members.forEach(m => print("  " + m.name + "  " + m.stateStr))'
          # index for GET /api/history (newest first); the replica-set URL sends it to the PRIMARY
          mongosh --quiet "mongodb://mongo-0.mongo:27017,mongo-1.mongo:27017,mongo-2.mongo:27017/emidb?replicaSet=rs0" \
            --eval 'print("index on emidb.calculations:", db.calculations.createIndex({createdAt: -1}))'
