# Log which backend served each request and how long it took
log_format upstream_log '$remote_addr - [$time_local] "$request" $status '
                        'upstream=$upstream_addr response_time=$upstream_response_time '
                        'request_time=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream_log;

    location / {
        proxy_pass http://app_servers;          # round-robin by default
        proxy_http_version 1.1;                 # reuse connections to the containers
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # If a container fails, retry the request on another one
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
