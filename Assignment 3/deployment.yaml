apiVersion: apps/v1
kind: Deployment
metadata:
  name: fft-deployment
  labels:
    app: fft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fft
  template:
    metadata:
      labels:
        app: fft
    spec:
      containers:
      - name: fft
        image: pucitcloudnet/fft
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
